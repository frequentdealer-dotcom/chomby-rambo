<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101010">
  <title>Winter Spin Fest 2026 | Chomby Rambo</title>

  <style>
    :root {
      --bg: #101010;
      --panel: #191919;
      --yellow: #f5d323;
      --text: #f7f7f7;
      --muted: #a6a6a6;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.6;
    }

    .wrap {
      width: min(900px, 90%);
      margin: auto;
    }

    header {
      padding: 22px 0;
    }

    header a {
      color: var(--yellow);
      text-decoration: none;
    }

    .event {
      padding: 35px 0 60px;
    }

    .eyebrow {
      color: var(--yellow);
      font-size: 13px;
      letter-spacing: 2px;
      font-weight: bold;
    }

    h1 {
      font-size: clamp(30px, 6vw, 48px);
      margin: 8px 0;
    }

    .muted { color: var(--muted); }

    .poster {
      display: block;
      width: 100%;
      max-width: 650px;
      height: auto;
      margin: 28px auto;
      border-radius: 12px;
    }

    .gallery {
      margin-top: 55px;
      padding: 25px;
      background: var(--panel);
      border-radius: 12px;
      text-align: center;
    }

    footer {
      padding: 25px 0;
      border-top: 1px solid #303030;
      color: var(--muted);
      font-size: 13px;
    }
  </style>
</head>

<body>

  <header class="wrap">
    <a href="index.html">← Back to Chomby Rambo</a>
  </header>

  <main class="wrap event">

    <div class="eyebrow">SPIN SHOW COVERAGE</div>

    <h1>Winter Spin Fest 2026</h1>

    <p class="muted">
      4 July 2026
    </p>

    <img
      class="poster"
      src="gallery/winter-spin-fest-2026-poster.jpg"
      alt="Winter Spin Fest 2026 event poster"
    >

    <section class="gallery">
      <div class="eyebrow">EVENT GALLERY</div>
      <h2>Moments from the show</h2>
      <p class="muted">
        Photographs from Winter Spin Fest 2026 will be added here.
      </p>
    
<div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; margin-top:24px;">

  <a href="https://www.instagram.com/reel/DaiDSKWo8-3/" target="_blank" rel="noopener">
    <img src="gallery/winter-spin-fest-reel-05.jpg" alt="Winter Spin Fest — Reel 5" style="width:100%; aspect-ratio:16/9; object-fit:cover; border-radius:10px;">
  </a>

  <a href="https://www.instagram.com/reel/Dak_flhNQzm/" target="_blank" rel="noopener">
    <img src="gallery/winter-spin-fest-reel-06.jpg" alt="Winter Spin Fest — Reel 6" style="width:100%; aspect-ratio:16/9; object-fit:cover; border-radius:10px;">
  </a>

  <a href="https://www.instagram.com/reel/DamgiRUoxxB/" target="_blank" rel="noopener">
    <img src="gallery/winter-spin-fest-reel-07.jpg" alt="Simon Santos — Winter Spin Fest" style="width:100%; aspect-ratio:16/9; object-fit:cover; border-radius:10px;">
  </a>

  <a href="https://www.instagram.com/reel/DatOIV4IosC/" target="_blank" rel="noopener">
    <img src="gallery/winter-spin-fest-reel-08.jpg" alt="Winter Spin Fest — Reel 8" style="width:100%; aspect-ratio:16/9; object-fit:cover; border-radius:10px;">
  </a>

</div>

    </section>

  </main>

  <footer class="wrap">
    Shot by Chomby Rambo
  </footer>

</body>
</html>
