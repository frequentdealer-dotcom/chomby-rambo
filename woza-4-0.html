    body {

      margin: 8px 0;

    main {

      margin: auto;
      padding: 22px 14px 40px;

    .poster {
      display: block;
      width: 100%;
      max-width: 600px;
      height: auto;
      margin: 0 auto 32px;

    }

      margin-bottom: 6px;
    }

    .intro {
      color: #c4c4c4;
      margin-top: 0;
      margin-bottom: 22px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .gallery img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 5px;
      background: #222;
    }

    .back-link {
      display: inline-block;
      margin-top: 30px;
      padding: 10px 16px;
      color: #111315;
      background: #f5c400;
      text-decoration: none;

    footer {

      color: #999;
      text-align: center;
      font-size: 13px;
    }

    @media (min-width: 650px) {

        gap: 12px;
      }
    }
